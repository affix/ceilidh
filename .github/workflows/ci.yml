name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: macos-latest, python: "3.12" }
          - { os: windows-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install the project
        run: uv sync --locked --group dev --python ${{ matrix.python }}

      # the suite pins SDL to its dummy drivers, so there is no display or
      # sound card involved and none is installed here
      - name: Run the tests
        run: uv run pytest

      - name: Check the command line starts
        run: |
          uv run ceilidh --help
          uv run ceilidh --list-songs

  package:
    name: debian package (${{ matrix.arch }})
    # both architectures build natively, so the Pi package is checked on
    # every push rather than only when a release is cut
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, os: ubuntu-latest }
          - { arch: arm64, os: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4

      - name: Build the .deb
        run: ./tools/build-deb.sh --arch ${{ matrix.arch }}

      - name: Show what came out
        run: dpkg-deb --info dist/*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: ceilidh-deb-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error

  desktop:
    name: standalone build (${{ matrix.os }})
    # PyInstaller cannot cross compile, so each one is built on its own runner
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install the project
        run: uv sync --locked --group package --python 3.12

      - name: Build it
        run: uv run python tools/build-app.py

      - name: Check the Windows build starts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = Start-Process -FilePath dist/Ceilidh.exe -ArgumentList '--list-songs' -Wait -PassThru
          if ($app.ExitCode -ne 0) { throw "exited $($app.ExitCode)" }

      - name: Check the macOS build starts
        if: runner.os == 'macOS'
        run: ./dist/Ceilidh.app/Contents/MacOS/Ceilidh --list-songs

      # tar the bundle so the executable bit survives the upload
      - name: Pack the macOS bundle
        if: runner.os == 'macOS'
        run: tar -czf dist/Ceilidh-macos.tar.gz -C dist Ceilidh.app

      - uses: actions/upload-artifact@v4
        with:
          name: ceilidh-${{ runner.os }}
          path: |
            dist/Ceilidh.exe
            dist/Ceilidh-macos.tar.gz
          if-no-files-found: error
